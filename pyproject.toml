[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "latentspace"
version = "0.1.0"
description = "One evolutionary algorithm for any problem: universal latent + co-evolving neural decoder."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["numpy>=1.23", "torch>=2.0.0", "matplotlib>=3.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "scipy>=1.10"]
bench = ["scipy>=1.10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["latentspace*", "finch4*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
