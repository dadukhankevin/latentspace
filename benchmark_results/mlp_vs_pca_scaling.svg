<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-size="10" role="img" aria-label="Log-log chart: PCA and MLP decoders both improve with family size K; PCA improves faster">
<style>
  svg { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .surface { fill: #fcfcfb; }
